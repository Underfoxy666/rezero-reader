name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#14121b' --iconBackgroundColorDark '#14121b' --splashBackgroundColor '#14121b' --splashBackgroundColorDark '#14121b'
          npx cap sync android

      - name: Build the .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ReZero-Reader.apk

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Re:Zero Reader (build ${{ github.run_number }})
          body: Tap ReZero-Reader.apk below on your Android phone to download and install it.
          files: ReZero-Reader.apk
          make_latest: true
